# MTP-GO on Colab — single run (not the seed sweep).
#
# Inherits every hyperparameter from mtp_go.yaml and only redirects the outputs
# to Google Drive, so a runtime reset does not lose checkpoints.
#
#   python adapters/mtp_go/train.py --config configs/models/mtp_go_colab.yaml \
#       --dataset highD --feature-mode dimI --mode full
#
# For the 5-seed sweep use configs/mtp_go/<dataset><0|1>-<1..5>.yaml and pass
# --output-dir/--ckpt-dir/--tensorboard-dir on the command line (see the adapter
# README, "Colab" section).

base: mtp_go.yaml

display_name: "MTP-GO (Colab)"

# Data is expected at ./data/<dataset>/{dimI,splits}, the same layout as
# neighformer/data — that is already mtp_go.yaml's default, so `data:` needs no
# override here.

training:
  # {dataset} / {feature_mode} / {exp_tag} are substituted, so runs never
  # overwrite each other.
  output_dir: "/content/drive/MyDrive/TrajectoryPrediction/sota_experiments/runs/mtp_go/{dataset}/{feature_mode}"
  ckpt_dir: "/content/drive/MyDrive/TrajectoryPrediction/sota_experiments/ckpts"
  tensorboard_dir: "/content/drive/MyDrive/TrajectoryPrediction/sota_experiments/tensorboard"

runtime:
  # Colab VMs typically expose 2-8 cores; 2-4 workers is the sweet spot there.
  n_workers: 2
