model: par
display_name: "PAR"
upstream_dir: "external/par"
adapter_dir: "adapters/par"
input:
  coordinate_frame: "scene_or_agent_centric"
  uses_map: false
  ego_channels: 6
  neighbor_baseline_channels: 6
  raw_neighbor_channels: 10
  neighbor_dimI_channels: 8
training:
  batch_size: 128
  epochs: 100
  lr: 0.0003
  accelerator: "gpu"
notes:
  - "Official code includes a NuScenes car trajectory task using xy trajectories."
  - "Implement highD/exiD datamodule and decide whether dim/I are continuous side features or tokens."
